name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload production assets
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to CloudPanel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mail.r0xyy.my.id
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download production assets
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: public/build/

      - name: Configure SSH
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
          CLOUDPANEL_SSH_KEY: ${{ secrets.CLOUDPANEL_SSH_KEY }}
          CLOUDPANEL_KNOWN_HOSTS: ${{ secrets.CLOUDPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in CLOUDPANEL_HOST CLOUDPANEL_USER CLOUDPANEL_SSH_KEY CLOUDPANEL_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done

          port="${CLOUDPANEL_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]] || (( port < 1 || port > 65535 )); then
            echo "CLOUDPANEL_PORT must be a valid TCP port." >&2
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CLOUDPANEL_SSH_KEY" > "$HOME/.ssh/cloudpanel_deploy"
          chmod 600 "$HOME/.ssh/cloudpanel_deploy"
          printf '%s\n' "$CLOUDPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$port" > "$HOME/.ssh/cloudpanel_port"

      - name: Sync application files
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
          CLOUDPANEL_PATH: ${{ secrets.CLOUDPANEL_PATH }}
        run: |
          set -euo pipefail

          if [[ ! "$CLOUDPANEL_USER" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "CLOUDPANEL_USER contains unsupported characters." >&2
            exit 1
          fi

          if [[ ! "$CLOUDPANEL_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "CLOUDPANEL_HOST must be a hostname or IPv4 address." >&2
            exit 1
          fi

          if [[ ! "$CLOUDPANEL_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "CLOUDPANEL_PATH must be an absolute path using only letters, numbers, dots, underscores, slashes, and hyphens." >&2
            exit 1
          fi

          port="$(cat "$HOME/.ssh/cloudpanel_port")"
          ssh_options=(-i "$HOME/.ssh/cloudpanel_deploy" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          destination="$CLOUDPANEL_USER@$CLOUDPANEL_HOST"

          ssh "${ssh_options[@]}" "$destination" "test -d '$CLOUDPANEL_PATH' && test -w '$CLOUDPANEL_PATH'"
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            --exclude='/database/*.sqlite*' \
            -e "ssh -i $HOME/.ssh/cloudpanel_deploy -p $port -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$destination:$CLOUDPANEL_PATH/"

      - name: Install production dependencies and migrate
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
          CLOUDPANEL_PATH: ${{ secrets.CLOUDPANEL_PATH }}
        run: |
          set -euo pipefail

          port="$(cat "$HOME/.ssh/cloudpanel_port")"
          ssh_options=(-i "$HOME/.ssh/cloudpanel_deploy" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$CLOUDPANEL_USER@$CLOUDPANEL_HOST" \
            "cd '$CLOUDPANEL_PATH' && composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader && php artisan migrate --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"